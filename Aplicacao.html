<script>
const estado={boot:null,tela:'painel'};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chamada(acao,dados){return new Promise((resolve,reject)=>{let terminou=false;const tempo=setTimeout(()=>{if(!terminou){terminou=true;reject(new Error('O servidor demorou mais de 30 segundos. Atualize a página e tente novamente.'))}},30000);google.script.run.withSuccessHandler(r=>{if(terminou)return;terminou=true;clearTimeout(tempo);r&&r.ok?resolve(r.dados):reject(new Error(r&&r.erro?r.erro:'Resposta inválida do servidor.'))}).withFailureHandler(e=>{if(terminou)return;terminou=true;clearTimeout(tempo);reject(new Error(e&&e.message?e.message:String(e||'Falha na comunicação com o servidor.')))}).api(acao,dados||{})})}
function aviso(msg,erro){const t=$('#toast');t.textContent=msg;t.style.background=erro?'#a52f2f':'#203040';t.classList.add('visivel');setTimeout(()=>t.classList.remove('visivel'),3500)}
function alternarMenu(){document.querySelector('aside').classList.toggle('aberto')}
async function iniciar(){try{estado.boot=await chamada('bootstrap');if(!estado.boot||!estado.boot.usuario)throw new Error('O servidor não retornou os dados do usuário.');$('#usuario').textContent=estado.boot.usuario.nome+' · '+estado.boot.usuario.perfil;montarMenu();await abrir(estado.boot.usuario.perfil==='Motorista'?'motorista':'painel')}catch(e){$('#conteudo').innerHTML='<div class="painel"><h1>Acesso indisponível</h1><p>'+esc(e&&e.message?e.message:String(e))+'</p><p>Confirme a implantação, o login Google e o cadastro na aba <code>Usuarios</code>.</p><div class="acoes"><button onclick="location.reload()">Tentar novamente</button></div></div>'}}
function montarMenu(){const motor=estado.boot.usuario.perfil==='Motorista',itens=motor?[['motorista','Minhas ordens']]:[['painel','Painel'],['clientes','Clientes'],['locacoes','Locações'],['ordens','Ordens de serviço'],['pagamentos','Pagamentos'],['cadastros','Cadastros']];$('#nav').innerHTML=itens.map(i=>`<button data-t="${i[0]}" onclick="abrir('${i[0]}')">${i[1]}</button>`).join('')}
async function abrir(t){estado.tela=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('ativo',b.dataset.t===t));alternarMenuFechar();try{await ({painel:telaPainel,clientes:telaClientes,locacoes:telaLocacoes,ordens:telaOrdens,pagamentos:telaPagamentos,cadastros:telaCadastros,motorista:telaMotorista}[t]||telaPainel)()}catch(e){$('#conteudo').innerHTML='<div class="painel"><h1>Não foi possível abrir esta tela</h1><p>'+esc(e&&e.message?e.message:String(e))+'</p><button onclick="location.reload()">Recarregar</button></div>'}}
function alternarMenuFechar(){if(innerWidth<=720)$('#nav').classList.remove('aberto')}
async function telaPainel(){const p=await chamada('painel');const cs=p.cacambasPorStatus||{};$('#conteudo').innerHTML=`<h1>Painel operacional</h1><div class="grid">${Object.entries(cs).map(x=>`<div class="card">Caçambas ${esc(x[0])}<strong>${x[1]}</strong></div>`).join('')}<div class="card">Locações em andamento<strong>${p.locacoesAndamento}</strong></div><div class="card">Serviços hoje<strong>${p.servicosHoje}</strong></div><div class="card">Ordens pendentes<strong>${p.ordensPendentes}</strong></div><div class="card">Itens excedentes<strong>${p.itensExcedentes}</strong></div><div class="card">Saldo pendente<strong>R$ ${Number(p.valoresPendentes).toFixed(2)}</strong></div></div>`}
async function telaClientes(){const lista=await chamada('listar',{entidade:'Clientes'});$('#conteudo').innerHTML=`<h1>Clientes</h1><div class="acoes"><button onclick="formCliente()">Novo cliente</button></div><div class="tabela"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>Status</th></tr></thead><tbody>${lista.map(x=>`<tr><td>${esc(x.NomeRazao)}</td><td>${esc(x.CpfCnpj)}</td><td>${esc(x.Telefone1)}</td><td>${esc(x.Status)}</td></tr>`).join('')}</tbody></table></div>`}
function formCliente(){renderForm('Novo cliente',`<label>Tipo<select name="TipoPessoa"><option>PF</option><option>PJ</option></select></label><label>Nome/Razão<input name="NomeRazao" required></label><label>CPF/CNPJ<input name="CpfCnpj" required></label><label>Telefone<input name="Telefone1"></label><label>E-mail<input name="Email" type="email"></label><label class="linha-inteira">Observações<textarea name="Observacoes"></textarea></label>`,'salvarCliente',()=>telaClientes())}
function renderForm(titulo,campos,acao,apos){$('#conteudo').innerHTML=`<h1>${titulo}</h1><form class="painel form" id="form">${campos}<div class="linha-inteira acoes"><button>Salvar</button><button type="button" class="sec" onclick="abrir('${estado.tela}')">Cancelar</button></div></form>`;$('#form').onsubmit=async e=>{e.preventDefault();const bt=e.submitter;bt.disabled=true;try{const dados=Object.fromEntries(new FormData(e.target));await chamada(acao,dados);aviso('Salvo com sucesso.');apos()}catch(err){aviso(err.message,true);bt.disabled=false}}}
async function telaLocacoes(){const lista=await chamada('listar',{entidade:'Locacoes'});$('#conteudo').innerHTML=`<h1>Locações</h1><div class="acoes"><button onclick="formLocacao()">Nova locação</button></div>${tabelaGenerica(lista,['Numero','DataSolicitacao','ValorTotal','StatusOperacional','StatusFinanceiro'],x=>`<button onclick="confirmar('${x.ID}')">Confirmar</button>`)}`}
function formLocacao(){const o=estado.boot.opcoes,dis=o.cacambas.filter(x=>x.Status==='Disponível');$('#conteudo').innerHTML=`<h1>Nova locação</h1><form class="painel form" id="formLoc"><label>Cliente<select name="ClienteID" required><option value="">Selecione</option>${o.clientes.map(x=>`<option value="${x.ID}">${esc(x.NomeRazao)}</option>`).join('')}</select></label><label>Endereço<select name="EnderecoID" required>${o.enderecos.map(x=>`<option value="${x.ID}">${esc(x.Descricao)} — ${esc(x.Logradouro)}</option>`).join('')}</select></label><label>Caçamba<select name="CacambaID">${dis.map(x=>`<option value="${x.ID}">${esc(x.Numero)}</option>`).join('')}</select></label><label>Resíduo<select name="TipoResiduoID">${o.residuos.filter(x=>x.Permitido==='Sim').map(x=>`<option value="${x.ID}">${esc(x.Nome)}</option>`).join('')}</select></label><label>Valor base<input name="ValorBase" type="number" step=".01" required></label><label>Diária excedente<input name="ValorDiaria" type="number" step=".01" required></label><label>Distância km<input name="DistanciaKm" type="number" step=".1"></label><label>Taxa deslocamento<input name="TaxaDeslocamento" type="number" step=".01"></label><label class="linha-inteira">Observações<textarea name="Observacoes"></textarea></label><div class="linha-inteira acoes"><button>Salvar locação</button></div></form>`;$('#formLoc').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.itens=[{CacambaID:f.CacambaID,TipoResiduoID:f.TipoResiduoID,ValorBase:f.ValorBase,ValorDiaria:f.ValorDiaria}];delete f.CacambaID;delete f.TipoResiduoID;delete f.ValorBase;delete f.ValorDiaria;try{await chamada('salvarLocacao',f);aviso('Locação criada.');telaLocacoes()}catch(x){aviso(x.message,true)}}}
async function confirmar(id){if(!confirm('Confirmar e reservar as caçambas?'))return;try{await chamada('confirmarLocacao',{locacaoId:id});aviso('Locação confirmada.');telaLocacoes()}catch(e){aviso(e.message,true)}}
async function telaOrdens(){const lista=await chamada('listar',{entidade:'OrdensServico'});$('#conteudo').innerHTML=`<h1>Ordens de serviço</h1><div class="acoes"><button onclick="formOS()">Nova ordem</button></div>${tabelaGenerica(lista,['Numero','Tipo','DataProgramada','Prioridade','Status'],x=>x.Status==='Concluída'?`<button onclick="pdf('${x.ID}')">PDF</button>`:'')}`}
function formOS(){const o=estado.boot.opcoes;$('#conteudo').innerHTML=`<h1>Nova ordem</h1><form class="painel form" id="fOS"><label>Locação ID<input name="locacaoId" required></label><label>Item da locação ID<input name="itemId" required></label><label>Tipo<select name="tipo"><option>Entrega</option><option>Retirada</option><option>Troca</option></select></label><label>Data programada<input type="datetime-local" name="dataProgramada" required></label><label>Motorista<select name="motoristaId">${o.motoristas.map(x=>`<option value="${x.ID}">${esc(x.Nome)}</option>`).join('')}</select></label><label>Caminhão<select name="caminhaoId">${o.caminhoes.map(x=>`<option value="${x.ID}">${esc(x.Placa)}</option>`).join('')}</select></label><label>Prioridade<select name="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select></label><div class="linha-inteira"><button>Criar OS</button></div></form>`;$('#fOS').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.itemIds=[d.itemId];delete d.itemId;try{await chamada('criarOS',d);aviso('OS criada.');telaOrdens()}catch(x){aviso(x.message,true)}}}
async function pdf(id){try{const r=await chamada('gerarPdfOS',{osId:id});window.open(r.url,'_blank')}catch(e){aviso(e.message,true)}}
async function telaPagamentos(){const lista=await chamada('listar',{entidade:'Pagamentos'});$('#conteudo').innerHTML=`<h1>Pagamentos</h1><div class="acoes"><button onclick="formPagamento()">Registrar pagamento</button></div>${tabelaGenerica(lista,['Data','LocacaoID','Valor','Forma','Status'])}`}
function formPagamento(){renderForm('Registrar pagamento',`<label>Locação ID<input name="locacaoId" required></label><label>Valor<input name="valor" type="number" step=".01" required></label><label>Forma<select name="forma"><option>Pix</option><option>Dinheiro</option></select></label><label>Observação<input name="observacao"></label><input type="hidden" name="idempotencia" value="${crypto.randomUUID()}">`,'registrarPagamento',()=>telaPagamentos())}
function telaCadastros(){const c=estado.boot.opcoes;$('#conteudo').innerHTML=`<h1>Cadastros operacionais</h1><div class="grid"><div class="card">Caçambas<strong>${c.cacambas.length}</strong></div><div class="card">Motoristas<strong>${c.motoristas.length}</strong></div><div class="card">Caminhões<strong>${c.caminhoes.length}</strong></div><div class="card">Resíduos<strong>${c.residuos.length}</strong></div></div><p class="painel">Nesta primeira versão, cadastros críticos são mantidos pelo administrador na planilha ou pela API <code>salvarCadastro</code>, preservando a auditoria.</p>`}
async function telaMotorista(){const lista=await chamada('listarMinhasOS',{});$('#conteudo').innerHTML=`<h1>Minhas ordens</h1>${lista.length?lista.map(x=>`<div class="painel os"><h3>${esc(x.Numero)} · ${esc(x.Tipo)}</h3><p><span class="tag">${esc(x.Status)}</span> ${esc(x.DataProgramada)}</p><p>${esc(x.EnderecoSnapshot)}</p><div class="acoes">${x.Status==='Programada'?`<button onclick="iniciarOs('${x.ID}')">Iniciar</button>`:''}${!['Concluída','Cancelada'].includes(x.Status)?`<button onclick="formConcluir('${x.ID}')">Concluir</button><button class="perigo" onclick="impedir('${x.ID}')">Impedimento</button>`:''}</div></div>`).join(''):'<div class="vazio">Nenhuma ordem atribuída.</div>'}`}
async function iniciarOs(id){try{await chamada('iniciarOS',{osId:id});aviso('Serviço iniciado.');telaMotorista()}catch(e){aviso(e.message,true)}}
function impedir(id){const motivo=prompt('Descreva o impedimento:');if(!motivo)return;chamada('registrarImpedimento',{osId:id,motivo}).then(()=>telaMotorista()).catch(e=>aviso(e.message,true))}
function formConcluir(id){$('#conteudo').innerHTML=`<h1>Concluir serviço</h1><form id="fc" class="painel form"><label class="linha-inteira">Fotos (mínimo 2)<input id="fotos" type="file" accept="image/*" capture="environment" multiple required></label><label>Nome de quem assinou<input name="nomeSignatario" required></label><label class="linha-inteira">Observações<textarea name="observacoes"></textarea></label><label class="linha-inteira">Assinatura<canvas id="sig" class="assinatura"></canvas></label><div class="linha-inteira acoes"><button>Concluir</button><button type="button" class="sec" onclick="limparAssinatura()">Limpar assinatura</button></div></form>`;prepararAssinatura();$('#fc').onsubmit=async e=>{e.preventDefault();const ar=[...$('#fotos').files];if(ar.length<2)return aviso('Selecione no mínimo duas fotos.',true);const fotos=await Promise.all(ar.map(comprimirImagem));const d=Object.fromEntries(new FormData(e.target));d.osId=id;d.fotos=fotos;d.assinaturaBase64=$('#sig').toDataURL('image/png');try{await chamada('concluirOS',d);aviso('Serviço concluído.');telaMotorista()}catch(x){aviso(x.message,true)}}}
function prepararAssinatura(){const c=$('#sig'),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';let p=false;const pos=e=>{const q=e.touches?.[0]||e,rr=c.getBoundingClientRect();return [q.clientX-rr.left,q.clientY-rr.top]};c.onpointerdown=e=>{p=true;ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(p){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>p=false}
function limparAssinatura(){const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function comprimirImagem(file){return new Promise((res,rej)=>{const img=new Image,fr=new FileReader;fr.onload=()=>img.src=fr.result;fr.onerror=rej;img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};fr.readAsDataURL(file)})}
function tabelaGenerica(lista,colunas,acoes){return `<div class="tabela"><table><thead><tr>${colunas.map(c=>`<th>${c}</th>`).join('')}${acoes?'<th>Ações</th>':''}</tr></thead><tbody>${lista.map(x=>`<tr>${colunas.map(c=>`<td>${esc(x[c])}</td>`).join('')}${acoes?`<td>${acoes(x)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
document.addEventListener('DOMContentLoaded',iniciar);
</script>
