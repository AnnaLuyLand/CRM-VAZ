<style>
:root{--azul:#0f4c81;--azul2:#1769aa;--fundo:#f4f7fa;--texto:#203040;--verde:#248a55;--vermelho:#c43838;--borda:#d9e2ea}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:var(--texto);background:var(--fundo)}header{height:58px;background:var(--azul);color:#fff;display:flex;align-items:center;padding:0 18px;position:fixed;inset:0 0 auto 0;z-index:4;gap:14px}header div{display:flex;flex-direction:column}header small{opacity:.8}#usuario{margin-left:auto}.menu{background:none;border:0;color:#fff;font-size:24px}aside{position:fixed;top:58px;bottom:0;width:220px;background:#fff;border-right:1px solid var(--borda);padding:12px;overflow:auto}aside button{width:100%;text-align:left;padding:11px;border:0;background:transparent;border-radius:7px;cursor:pointer;margin:2px 0}aside button:hover,aside button.ativo{background:#e8f2fb;color:var(--azul)}main{margin-left:220px;padding:82px 24px 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.painel{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px;box-shadow:0 2px 8px #1b42630d}.card strong{font-size:25px;display:block;margin-top:8px;color:var(--azul)}h1{font-size:22px;margin:0 0 18px}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,.botao{border:0;border-radius:7px;padding:10px 14px;background:var(--azul2);color:#fff;cursor:pointer}button.sec{background:#e5edf4;color:var(--texto)}button.perigo{background:var(--vermelho)}button:disabled{opacity:.55;cursor:wait}label{display:flex;flex-direction:column;gap:5px;font-weight:bold}input,select,textarea{width:100%;padding:10px;border:1px solid var(--borda);border-radius:6px;background:#fff}textarea{min-height:80px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.linha-inteira{grid-column:1/-1}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--borda);text-align:left}th{background:#eaf2f8}.tabela{overflow:auto;border:1px solid var(--borda);border-radius:8px}.tag{display:inline-block;padding:4px 8px;border-radius:12px;background:#e6eef5;font-size:12px}.tag.ok{background:#dff4e8;color:#17663c}.tag.alerta{background:#ffe7e7;color:#9a2424}.oculto{display:none!important}#toast{position:fixed;right:18px;bottom:18px;max-width:340px;padding:13px;background:#202c36;color:#fff;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#toast.visivel{opacity:1}.assinatura{border:1px solid var(--borda);background:#fff;width:100%;height:170px;touch-action:none}.os{border-left:5px solid var(--azul);margin-bottom:12px}.vazio{text-align:center;padding:40px;color:#637789}

</style>
